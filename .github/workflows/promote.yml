name: Promote QuoteBench

on:
  workflow_call:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: string
      commit:
        description: Full commit SHA
        required: true
        type: string
      allow_destructive_migrations:
        description: Explicit audited override for destructive migrations
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, test, preprod, production]
      commit:
        description: Full commit SHA (production must be on main)
        required: true
        type: string
      allow_destructive_migrations:
        description: Allow a detected destructive migration (manual and audited)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write

concurrency:
  group: quotebench-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  notify-production-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: inputs.target == 'production'
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v4
        if: inputs.target == 'production'
        with:
          node-version: 22.13.0
      - name: Send optional, data-minimised WhatsApp approval alert
        if: inputs.target == 'production'
        continue-on-error: true
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          ALERT_WHATSAPP_TO: ${{ secrets.ALERT_WHATSAPP_TO }}
        run: node scripts/send-whatsapp-alert.mjs approval "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  verify-and-deploy:
    needs: notify-production-approval
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Enforce pinned source and production main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
          if [[ "${{ inputs.target }}" == "production" ]]; then
            git fetch origin main
            git merge-base --is-ancestor "${{ inputs.commit }}" origin/main
          fi
      - name: Enforce ordered environment promotion
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.target }}
          COMMIT_SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            dev) prerequisite="" ;;
            test) prerequisite="dev" ;;
            preprod) prerequisite="test" ;;
            production) prerequisite="preprod" ;;
            *) echo "Unsupported environment: $TARGET_ENV" >&2; exit 1 ;;
          esac
          if [[ -n "$prerequisite" ]]; then
            tag="deployed-${prerequisite}-${COMMIT_SHA}"
            git fetch --quiet origin "refs/tags/${tag}:refs/tags/${tag}"
            test "$(git rev-list -n 1 "$tag")" = "$COMMIT_SHA"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run typecheck
      - run: npm test
      - name: Reject destructive migrations unless this run has an explicit audited override
        env:
          ALLOW_DESTRUCTIVE_MIGRATIONS: ${{ inputs.allow_destructive_migrations }}
        run: node --experimental-strip-types scripts/check-migrations.mjs
      - name: Record reproducible artifact digest
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          echo "digest=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SHA256SUMS
      - name: Render environment configuration
        id: config
        env:
          DEPLOY_ENV: ${{ inputs.target }}
          BUILD_COMMIT_SHA: ${{ inputs.commit }}
          BUILD_ARTIFACT_SHA256: ${{ steps.artifact.outputs.digest }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_HYPERDRIVE_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: echo "path=$(node scripts/render-cloudflare-config.mjs)" >> "$GITHUB_OUTPUT"
      - name: Prepare version-scoped secrets
        id: secrets
        env:
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
          OPERATOR_EMAIL_SHA256: ${{ secrets.OPERATOR_EMAIL_SHA256 }}
          EMAIL_API_ENDPOINT: ${{ secrets.EMAIL_API_ENDPOINT }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_STARTER: ${{ secrets.STRIPE_PRICE_STARTER }}
          STRIPE_PRICE_PROFESSIONAL: ${{ secrets.STRIPE_PRICE_PROFESSIONAL }}
          STRIPE_PRICE_SCALE: ${{ secrets.STRIPE_PRICE_SCALE }}
          HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
          HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          XERO_CLIENT_ID: ${{ secrets.XERO_CLIENT_ID }}
          XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
          QUICKBOOKS_CLIENT_ID: ${{ secrets.QUICKBOOKS_CLIENT_ID }}
          QUICKBOOKS_CLIENT_SECRET: ${{ secrets.QUICKBOOKS_CLIENT_SECRET }}
        run: echo "path=$(node scripts/write-cloudflare-secrets.mjs)" >> "$GITHUB_OUTPUT"
      - name: Capture current rollback target
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          deployments=$(npx wrangler deployments list --config "${{ steps.config.outputs.path }}" --json)
          previous=$(printf '%s' "$deployments" | jq -r '.[-1].versions | max_by(.percentage) | .version_id')
          test -n "$previous" && test "$previous" != "null"
          echo "version_id=$previous" >> "$GITHUB_OUTPUT"
      - name: Upload immutable version from pinned commit
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          output=$(npx wrangler versions upload --config "${{ steps.config.outputs.path }}" --secrets-file "${{ steps.secrets.outputs.path }}" --tag "${{ inputs.commit }}" --message "${{ inputs.target }} from ${{ inputs.commit }}")
          printf '%s\n' "$output"
          version_id=$(printf '%s\n' "$output" | sed -nE 's/.*Worker Version ID: ([a-f0-9-]+).*/\1/p' | tail -1)
          test -n "$version_id"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      - name: Migrate, assure, canary and promote with verified rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CONTROL_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          NEW_VERSION: ${{ steps.upload.outputs.version_id }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version_id }}
          TARGET_ENV: ${{ inputs.target }}
          COMMIT_SHA: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          ALERT_WHATSAPP_TO: ${{ secrets.ALERT_WHATSAPP_TO }}
        shell: bash
        run: |
          set -Eeuo pipefail
          config="${{ steps.config.outputs.path }}"
          WORKER_NAME=$(jq -r '.name' "$config")
          export WORKER_NAME

          escalate() {
            local message="$1"
            echo "::error::$message"
            gh issue create --title "Release rollback failed: ${TARGET_ENV}" --body "Automated release assurance failed and rollback did not restore a healthy endpoint. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --label incident 2>/dev/null || \
              gh issue create --title "Release rollback failed: ${TARGET_ENV}" --body "Automated release assurance failed and rollback did not restore a healthy endpoint. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
            node scripts/send-whatsapp-alert.mjs incident || true
          }

          rollback_on_error() {
            local original_status=$?
            trap - ERR
            set +e
            npx wrangler rollback "$PREVIOUS_VERSION" --config "$config" --message "Automatic rollback after failed ${TARGET_ENV} assurance for ${COMMIT_SHA}" --yes
            local rollback_status=$?
            local health_status="000"
            for attempt in 1 2 3 4 5; do
              health_status=$(curl --silent --show-error --output rollback-health.json --write-out '%{http_code}' "$PUBLIC_SITE_URL/api/health" || true)
              [[ "$health_status" == "200" ]] && grep -q '"status":"ok"' rollback-health.json && break
              sleep 5
            done
            if [[ "$rollback_status" -ne 0 || "$health_status" != "200" ]] || ! grep -q '"status":"ok"' rollback-health.json; then
              escalate "Rollback failed or did not restore QuoteBench health. Immediate operator action is required."
            else
              echo "::warning::Release assurance failed; the previous Worker version was restored and verified healthy."
              node scripts/send-whatsapp-alert.mjs recovery || true
            fi
            exit "$original_status"
          }
          trap rollback_on_error ERR

          npx wrangler versions deploy "${NEW_VERSION}@0" "${PREVIOUS_VERSION}@100" --config "$config" --message "Zero-traffic migration gate for ${TARGET_ENV} ${COMMIT_SHA}" --yes
          node --experimental-strip-types scripts/release-control.mjs migrate "$PUBLIC_SITE_URL" "$WORKER_NAME" "$NEW_VERSION" "$COMMIT_SHA"
          for request in 1 2 3; do
            node --experimental-strip-types scripts/release-control.mjs assure "$PUBLIC_SITE_URL" "$WORKER_NAME" "$NEW_VERSION" "$COMMIT_SHA"
          done

          if [[ "$TARGET_ENV" == "production" ]]; then
            npx wrangler versions deploy "${NEW_VERSION}@10" "${PREVIOUS_VERSION}@90" --config "$config" --message "10 percent production canary for ${COMMIT_SHA}" --yes
            minimum_requests=20
            observation_seconds=120
            started=$(date +%s)
            passed=0
            for request in $(seq 1 "$minimum_requests"); do
              node --experimental-strip-types scripts/release-control.mjs assure "$PUBLIC_SITE_URL" "$WORKER_NAME" "$NEW_VERSION" "$COMMIT_SHA"
              passed=$((passed + 1))
              sleep $((observation_seconds / minimum_requests))
            done
            elapsed=$(( $(date +%s) - started ))
            test "$passed" -ge "$minimum_requests"
            test "$elapsed" -ge "$observation_seconds"
          fi

          npx wrangler versions deploy "${NEW_VERSION}@100" --config "$config" --message "Assured ${TARGET_ENV} deployment of ${COMMIT_SHA}" --yes
          node --experimental-strip-types scripts/release-control.mjs assure "$PUBLIC_SITE_URL" "$WORKER_NAME" "$NEW_VERSION" "$COMMIT_SHA"
          curl --fail --silent --show-error --output health.json "$PUBLIC_SITE_URL/api/health"
          grep -q '"status":"ok"' health.json
          curl --fail --silent --show-error --output sign-in.html "$PUBLIC_SITE_URL/auth/sign-in"
          grep -q "Welcome to QuoteBench" sign-in.html
          trap - ERR
      - name: Record successful environment deployment
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.target }}
          COMMIT_SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="deployed-${TARGET_ENV}-${COMMIT_SHA}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$COMMIT_SHA"
          else
            git tag -a "$tag" -m "${TARGET_ENV} deployment of ${COMMIT_SHA}"
            git push origin "$tag"
          fi
      - name: Publish deployment summary
        run: |
          {
            echo "### QuoteBench staged promotion"
            echo "- Environment: ${{ inputs.target }}"
            echo "- Commit: ${{ inputs.commit }}"
            echo "- Cloudflare version: ${{ steps.upload.outputs.version_id }}"
            echo "- Rollback target: ${{ steps.previous.outputs.version_id }}"
            echo "- Artifact digest: ${{ steps.artifact.outputs.digest }}"
            echo "- Pricing trace, dependency, schema and runtime identity gates: passed"
            echo "- Production canary controls: 10%, 120 seconds and 20 controlled requests"
            echo "- Artifact provenance: attested"
          } >> "$GITHUB_STEP_SUMMARY"

  mark-production-gold:
    if: inputs.target == 'production'
    needs: verify-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Tag last-known-good source
        env:
          GOLD_TAG: production-gold-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$GOLD_TAG" -m "Production last-known-good ${{ inputs.commit }}"
          git push origin "$GOLD_TAG"

